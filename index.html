<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Food Recorder">
  <meta name="theme-color" content="#7dccae">
  <title>🍲 Food Recorder</title>
  <link rel="stylesheet" href="style.css">
  <link rel="apple-touch-icon" href="icon-180.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
  <link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <div id="splash">
    <div class="splash-content">
      <div class="splash-logo" id="splashLogo">
        <img src="logo.png" alt="Seyed Sadegh Majedi" class="splash-logo-img">
      </div>
      <div class="splash-glow"></div>
    </div>
  </div>

  <div class="app-container" id="appContainer" style="display:none;">
    <header>
      <div class="header-left">
        <h1>🍲 Food Recorder</h1>
        <span class="version-badge" id="versionBadge">v1.1</span>
      </div>
      <div class="header-actions">
        <button class="header-settings" id="btnOpenStats" title="آمار">📊</button>
        <button class="header-settings" id="btnOpenSettings" title="تنظیمات">⚙️</button>
      </div>
    </header>

    <section id="main" class="tab-content active">
      <div class="filter-bar">
        <input type="text" id="searchInput" placeholder="🔍 جستجوی غذا..." class="search-input">
        <select id="filterGroup" class="filter-select">
          <option value="">📂 همه گروه‌ها</option>
        </select>
        <select id="filterMaker" class="filter-select">
          <option value="">👨‍🍳 همه تهیه‌کننده‌ها</option>
        </select>
      </div>
      <div id="foodList"></div>
      <button class="fab" id="btnOpenAdd">+</button>
    </section>

    <section id="statsSection" class="tab-content">
      <div class="stats-back-wrap">
        <button class="btn-secondary stats-back-btn" id="btnBackFromStats">‹ بازگشت به لیست</button>
      </div>
      <div class="stats-summary">
        <div class="stat-card">
          <div class="stat-value" id="statTotalRecords">0</div>
          <div class="stat-label">کل ثبت‌ها</div>
        </div>
        <div class="stat-card">
          <div class="stat-value" id="statUniqueFoods">0</div>
          <div class="stat-label">غذای متفاوت</div>
        </div>
        <div class="stat-card">
          <div class="stat-value" id="statUniqueMakers">0</div>
          <div class="stat-label">تهیه‌کننده/مکان</div>
        </div>
      </div>

      <div class="stats-block">
        <h3 class="stats-heading">🍽️ پرتکرارترین غذاها</h3>
        <div id="statsFoodList" class="stats-bar-list"></div>
      </div>

      <div class="stats-block">
        <h3 class="stats-heading">👨‍🍳 پرتکرارترین تهیه‌کننده / مکان</h3>
        <div id="statsMakerList" class="stats-bar-list"></div>
      </div>
    </section>

    <div class="modal-overlay" id="addModal">
      <div class="modal">
        <div class="modal-header">
          <h2 id="addModalTitle">➕ ثبت غذای جدید</h2>
          <button class="modal-close" id="btnCloseAdd">✕</button>
        </div>
        <div class="form-group">
          <label>🍽️ نام غذا</label>
          <input type="text" id="foodName" placeholder="مثلاً چلو قرمه سبزی" autocomplete="off">
          <div id="suggestions" class="suggestions"></div>
        </div>
        <div class="form-group">
          <label>📂 گروه غذا</label>
          <select id="foodGroup"></select>
        </div>
        <div class="form-group">
          <label>📅 تاریخ صرف/تهیه</label>
          <input type="date" id="foodDate">
        </div>
        <div class="form-group">
          <label>👨‍🍳 تهیه‌کننده / مکان</label>
          <input type="text" id="foodMaker" placeholder="مثلاً مادر / رستوران علی" autocomplete="off">
          <div id="makerSuggestions" class="suggestions"></div>
        </div>
        <div class="form-group">
          <label>🍚 نحوه صرف غذا</label>
          <input type="text" id="foodServing" placeholder="مثلاً با باقالی پلو / با چلو سفید" autocomplete="off">
          <div id="servingSuggestions" class="suggestions"></div>
        </div>
        <button class="btn-primary" id="btnAddFood">✅ ثبت</button>
      </div>
    </div>

    <div class="modal-overlay" id="settingsModal">
      <div class="modal">
        <div class="modal-header">
          <h2>⚙️ تنظیمات</h2>
          <button class="modal-close" id="btnCloseSettings">✕</button>
        </div>
        <div class="settings-section">
          <h3>📌 اطلاعات نسخه</h3>
          <div class="info-row">
            <span>نسخه فعلی:</span>
            <strong id="currentVersionText">1.1</strong>
          </div>
          <button class="btn-secondary" id="btnCheckUpdate">🔍 چک آپدیت</button>
          <div id="updateStatus"></div>
        </div>
        <div class="settings-section">
          <h3>📂 مدیریت گروه‌های غذا</h3>
          <div class="inline-form">
            <input type="text" id="newGroupName" placeholder="نام گروه جدید...">
            <button class="btn-primary btn-sm" id="btnAddGroup">➕</button>
          </div>
          <div id="groupsList"></div>
        </div>
        <div class="settings-section">
          <h3>🎨 رنگ گروه‌ها</h3>
          <div id="groupColorsList"></div>
        </div>
        <div class="settings-section">
          <h3>💾 پشتیبان‌گیری</h3>
          <button class="btn-secondary" id="btnExport">📥 دانلود فایل پشتیبان</button>
          <hr>
          <input type="file" id="importFile" accept=".json" style="display:none">
          <button class="btn-secondary" id="btnImport">📤 بازیابی از فایل</button>
        </div>
        <div class="settings-section danger-section">
          <h3>⚠️ پاک کردن همه داده‌ها</h3>
          <button class="btn-danger" id="btnClearAll">🗑️ پاک کردن همه</button>
        </div>
      </div>
    </div>

    <div id="toast" class="toast"></div>

    <footer>
      <p>ساخته‌شده با ❤️ — سید صادق مجدی</p>
    </footer>
  </div>

  <script src="script.js"></script>
</body>
</html>
